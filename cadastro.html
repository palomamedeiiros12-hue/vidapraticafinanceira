<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Vida Prática e Financeira</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="signup-title">
        <p class="eyebrow">Vida Prática e Financeira</p>
        <h1 id="signup-title">Criar conta</h1>

        <form id="signup-form" class="auth-form" novalidate>
          <div class="field">
            <label for="signup-name">Nome</label>
            <input id="signup-name" name="name" type="text" placeholder="Seu nome" required />
          </div>

          <div class="field">
            <label for="signup-email">E-mail</label>
            <input id="signup-email" name="email" type="email" placeholder="seu@email.com" required />
          </div>

          <div class="field">
            <label for="signup-password">Senha</label>
            <input id="signup-password" name="password" type="password" placeholder="Crie uma senha" required />
          </div>

          <button type="submit" class="btn btn-primary full-width">Cadastrar</button>
          <button type="button" class="btn btn-ghost full-width" data-role="link-login">Já tenho conta</button>
        </form>

        <p id="signup-message" class="form-message" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
