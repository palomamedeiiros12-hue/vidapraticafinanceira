<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha | Vida Prática e Financeira</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="reset-title">
        <p class="eyebrow">Vida Prática e Financeira</p>
        <h1 id="reset-title">Criar nova senha</h1>

        <form id="password-reset-form" class="auth-form" novalidate>
          <div class="field">
            <label for="reset-password">Nova senha</label>
            <input id="reset-password" name="password" type="password" autocomplete="new-password" placeholder="Pelo menos 8 caracteres" required />
          </div>

          <button type="submit" class="btn btn-primary full-width">Salvar nova senha</button>
        </form>

        <p id="password-reset-message" class="form-message" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="./js/password-reset.js"></script>
  </body>
</html>
