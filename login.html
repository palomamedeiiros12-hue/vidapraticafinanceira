<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Vida Prática e Financeira</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">Vida Prática e Financeira</p>
        <h1 id="login-title">Entrar</h1>

        <form id="login-form" class="auth-form" novalidate>
          <div class="field">
            <label for="login-email">E-mail</label>
            <input id="login-email" name="email" type="email" placeholder="seu@email.com" required />
          </div>

          <div class="field">
            <label for="login-password">Senha</label>
            <input id="login-password" name="password" type="password" placeholder="Sua senha" required />
          </div>

          <button type="submit" class="btn btn-primary full-width">Entrar</button>
          <button type="button" class="btn btn-secondary full-width" data-role="link-create">Criar conta</button>
          <button type="button" class="btn btn-ghost full-width" data-role="link-reset">Esqueci minha senha</button>
        </form>

        <p id="login-message" class="form-message" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
